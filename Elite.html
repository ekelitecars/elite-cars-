<style>
  :root{
    color-scheme:light;
    --bg:#ffffff; --ink:#0f1512; --muted:#68726c; --line:#e4e9e6;
    --em:#0e4a3a; --em-2:#17705a; --em-soft:#eaf3ef; --em-glow:rgba(14,74,58,.16);
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[lang="ar"]{--serif:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;--sans:Cairo,"Segoe UI",Tahoma,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:var(--sans);
    background:
      radial-gradient(820px 380px at 50% -120px, rgba(23,112,90,.10), transparent 70%),
      radial-gradient(520px 360px at 105% 105%, rgba(23,112,90,.07), transparent 70%),
      var(--bg);
    padding:calc(22px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:480px;text-align:center;position:relative}
  a,button{font-family:inherit}
  :focus-visible{outline:2px solid var(--em-2);outline-offset:3px;border-radius:10px}

  .rise{opacity:0;transform:translateY(14px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.04s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}.d4{animation-delay:.34s}.d5{animation-delay:.44s}.d6{animation-delay:.54s}.d7{animation-delay:.64s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}

  .top{display:flex;justify-content:flex-end;margin-bottom:6px}
  .lang{border:1px solid var(--line);background:#fff;color:var(--em);font-size:13px;font-weight:600;letter-spacing:.04em;
    padding:8px 16px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(15,21,18,.05);transition:border-color .2s}
  .lang:hover{border-color:var(--em-2)}

  .ring{width:118px;height:118px;border-radius:50%;margin:14px auto 0;padding:3px;
    background:conic-gradient(from 210deg,var(--em),#52b496,var(--em-2),var(--em));
    box-shadow:0 16px 38px var(--em-glow)}
  .ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#eceae2}
  h1{font-family:var(--serif);font-weight:700;font-size:42px;letter-spacing:.05em;line-height:1.1;margin:22px 0 8px;color:var(--ink)}
  html[lang="ar"] h1{letter-spacing:0}
  h1 em{font-style:normal;color:var(--em)}
  .tag{font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--em)}
  html[lang="ar"] .tag{letter-spacing:.1em}
  .sub{margin-top:10px;font-size:14px;color:var(--muted)}
  .divider{display:flex;align-items:center;gap:14px;margin:24px auto;max-width:240px}
  .divider:before,.divider:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9d6d0)}
  .divider:after{transform:scaleX(-1)}
  .divider i{width:7px;height:7px;background:var(--em);transform:rotate(45deg);border-radius:1px}

  .logo{display:block;text-decoration:none;border-radius:28px;padding:10px;background:#fff;border:1px solid var(--line);
    box-shadow:0 24px 56px rgba(15,21,18,.10),0 2px 0 rgba(255,255,255,.9) inset}
  .logo .frame{border-radius:20px;overflow:hidden;background:#fff;border:1px solid #eef1ef}
  .logo img{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:brightness(1.1) contrast(1.14)}
  .logo .cap{padding:14px 0 6px;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--em);font-weight:600}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .tile{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 10px;border-radius:18px;background:#fff;
    border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500;
    box-shadow:0 8px 22px rgba(15,21,18,.05);transition:transform .15s,border-color .2s,box-shadow .2s}
  .tile.wide{grid-column:1/-1}
  .tile svg{color:var(--em)}
  .tile:hover{border-color:var(--em-2);box-shadow:0 12px 28px var(--em-glow)}
  .tile:active{transform:scale(.98)}

  .label{display:flex;align-items:center;justify-content:center;gap:14px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--em);font-weight:600;margin:34px 0 16px}
  html[lang="ar"] .label{letter-spacing:.1em;font-size:13px}
  .label:before,.label:after{content:"";height:1px;width:34px;background:#cdd9d3}

  .person{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px 18px 14px;margin-bottom:14px;
    box-shadow:0 16px 40px rgba(15,21,18,.07);text-align:start}
  .p-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .ini{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:700;
    font-size:19px;letter-spacing:.04em;color:var(--em);background:var(--em-soft);border:1px solid #cfe3da}
  .p-id h3{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.15}
  .num{margin-top:3px;font-size:14px;letter-spacing:.14em;color:var(--muted);unicode-bidi:isolate}
  html[lang="ar"] .num{text-align:start}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .b{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 8px;border-radius:15px;text-decoration:none;
    font-size:14.5px;font-weight:600;transition:transform .15s,box-shadow .2s,background .2s}
  .b:active{transform:scale(.97)}
  .b.solid{background:linear-gradient(135deg,var(--em-2),var(--em));color:#fff;box-shadow:0 10px 24px var(--em-glow)}
  .b.solid:hover{box-shadow:0 14px 30px rgba(14,74,58,.28)}
  .b.line{border:1.5px solid var(--em);color:var(--em);background:#fff}
  .b.line:hover{background:var(--em-soft)}
  .save{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;padding:12px;border:0;background:transparent;
    color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;border-radius:12px;transition:color .2s,background .2s}
  .save:hover{color:var(--em);background:var(--em-soft)}

  .share{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;padding:15px;border-radius:18px;cursor:pointer;
    border:1px dashed #b7cbc2;background:var(--em-soft);color:var(--em);font-size:14.5px;font-weight:600;transition:background .2s}
  .share:hover{background:#dfeee7}
  footer{margin-top:30px;color:var(--muted);font-size:12.5px;line-height:1.9}
  footer b{display:block;color:var(--em);font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
  html[lang="ar"] footer b{letter-spacing:.08em;font-size:12px}
  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--em);color:#fff;
    padding:12px 20px;border-radius:999px;font-size:14px;box-shadow:0 14px 34px rgba(14,74,58,.35);transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
